<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>American Style — Acceso</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>American Style</h1>
    <p>Hamburguesas al estilo americano hechas al momento desde 2015.</p>
  </header>

  <nav aria-label="Navegación principal">
    <ul>
      <li><a href="burger_inicio.html">Inicio</a></li>
      <li><a href="burger_menu.html">Menú</a></li>
      <li><a href="burger_locales.html">Locales</a></li>
      <li><a href="burger_ofertas.html">Ofertas</a></li>
    </ul>
  </nav>

  <main>

    <section id="bienvenida">
      <h2>Acceso de socios</h2>
      <p>
        Inicia sesión para ver tus <strong>puntos de fidelidad</strong> y
        canjearlos por hamburguesas y postres.
      </p>
    </section>

    <section id="acceso">
      <h2>Iniciar sesión</h2>
      <form>
        <p>
          <label for="email">Correo electrónico</label><br>
          <input type="email" id="email" name="email" required>
        </p>
        <p>
          <label for="password">Contraseña</label><br>
          <input type="password" id="password" name="password" minlength="8" required>
        </p>
        <button type="submit">Sign in</button>
      </form>
    </section>

  </main>

  

</body>
</html>
